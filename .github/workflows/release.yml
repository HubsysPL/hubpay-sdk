name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build ZIP and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(date +%Y.%m.%d)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare ZIP archive
        run: |
          set -euo pipefail
          mkdir -p "hubpay-sdk-v${VERSION}"
          # Copy everything EXCEPT the workflow itself and dotfiles (.git, .github)
          # rsync is convenient; fall back to cp -r if rsync is missing on the runner.
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude='.git' --exclude='.github' --exclude='hubpay-sdk-v*' ./ "hubpay-sdk-v${VERSION}/"
          else
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.git' ! -name '.github' ! -name 'hubpay-sdk-v*' \
              -exec cp -r {} "hubpay-sdk-v${VERSION}/" \;
          fi
          # Normalize permissions inside the archive
          find "hubpay-sdk-v${VERSION}" -type d -exec chmod 0755 {} \;
          find "hubpay-sdk-v${VERSION}" -type f -exec chmod 0644 {} \;
          zip -r "hubpay-sdk-v${VERSION}.zip" "hubpay-sdk-v${VERSION}"
          echo "ZIP size: $(du -h "hubpay-sdk-v${VERSION}.zip" | cut -f1)"

      - name: Read CHANGELOG for tag
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md (## [X.Y.Z] ...)
          awk -v ver="$VERSION" '
            /^## \[/ { in_section = ($0 ~ "\\[" ver "\\]"); next }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            echo "Brak sekcji dla v${VERSION} w CHANGELOG.md — używam domyślnego opisu." > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            echo "Zobacz CHANGELOG.md po pełną listę zmian." >> /tmp/release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HubPay PHP SDK v${{ steps.version.outputs.version }}"
          body_path: /tmp/release-notes.md
          files: "hubpay-sdk-v${{ steps.version.outputs.version }}.zip"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
