name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Numer wersji (bez v) — np. 1.0.1. Puste = data YYYY.MM.DD.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build ZIP and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(date +%Y.%m.%d)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare ZIP archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "hubpay-sdk-v${VERSION}"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude='.git' --exclude='.github' --exclude='hubpay-sdk-v*' ./ "hubpay-sdk-v${VERSION}/"
          else
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.git' ! -name '.github' ! -name 'hubpay-sdk-v*' \
              -exec cp -r {} "hubpay-sdk-v${VERSION}/" \;
          fi
          find "hubpay-sdk-v${VERSION}" -type d -exec chmod 0755 {} \;
          find "hubpay-sdk-v${VERSION}" -type f -exec chmod 0644 {} \;
          zip -r "hubpay-sdk-v${VERSION}.zip" "hubpay-sdk-v${VERSION}"
          echo "ZIP size: $(du -h "hubpay-sdk-v${VERSION}.zip" | cut -f1)"

      - name: Extract CHANGELOG section for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { in_section = ($0 ~ "\\[" ver "\\]"); next }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            {
              echo "Brak sekcji dla v${VERSION} w CHANGELOG.md — zobacz CHANGELOG.md po pełną listę zmian."
            } > /tmp/release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "HubPay PHP SDK v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "hubpay-sdk-v${VERSION}.zip" \
            --target main
